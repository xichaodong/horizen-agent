name: Publish preview or release
on:
  push:
    tags: [ 'v*' ]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate version and image name
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Release tags must be vMAJOR.MINOR.PATCH with an optional prerelease suffix.' >&2
            exit 1
          fi
          printf 'image=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ steps.version.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish packaged application and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          docker pull "$IMAGE:$RELEASE_TAG"
          container=$(docker create "$IMAGE:$RELEASE_TAG")
          trap 'docker rm "$container" >/dev/null' EXIT
          artifact="horizen-agent-$RELEASE_TAG.jar"
          docker cp "$container:/opt/horizen-agent/app.jar" "$artifact"
          sha256sum "$artifact" > SHA256SUMS
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "$artifact" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Horizen Agent $RELEASE_TAG" \
            --generate-notes "${options[@]}"
