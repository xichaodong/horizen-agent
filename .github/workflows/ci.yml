name: Java CI
on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  public-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/test-public-content.py
      - run: python3 scripts/test-format-idea.py
      - run: python3 scripts/test-smoke-demo.py
      - run: python3 scripts/check-public-content.py
      - run: python3 scripts/check-java-style.py

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/horizen-agent/intellij
          key: ${{ runner.os }}-idea-${{ hashFiles('scripts/intellij-formatter.json') }}
      - run: python3 scripts/format-idea.py check --install
      - run: python3 scripts/check-java-style.py

  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: bash scripts/check-architecture-boundaries.sh
      - run: java scripts/CheckJavaDocs.java
      - run: |
          mkdir -p target
          ./mvnw --batch-mode --no-transfer-progress verify 2>&1 | tee target/ci-verify.log
        shell: bash
      - if: failure()
        run: python3 scripts/report-ci-failures.py
      - run: python3 scripts/smoke-demo.py
      - run: python3 scripts/smoke-demo.py --configuration-examples
      - run: ./mvnw --batch-mode --no-transfer-progress install -DskipTests
      - run: ./mvnw --batch-mode --no-transfer-progress -pl horizen-agent-examples exec:exec -Ddemo.mode=no-horizen
      - run: ./mvnw --batch-mode --no-transfer-progress -pl horizen-agent-examples exec:exec -Ddemo.mainClass=dev.horizen.agent.examples.RuntimeEmbeddingDemo

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: horizen-agent-web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: horizen-agent-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: horizen-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker compose config --quiet
      - run: docker compose -f compose.yml -f compose.configured.yml config --quiet
      - run: bash scripts/smoke-container.sh horizen-agent:ci
